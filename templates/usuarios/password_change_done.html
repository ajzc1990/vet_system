{% extends 'base.html' %}

{% block title %}Contraseña Actualizada - VeterSystem{% endblock %}

{% block content %}
<div class="container py-2" style="max-width: 520px;">
    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-5 text-center">
            <i class="bi bi-check-circle-fill text-success display-4 d-block mb-3"></i>
            <h5 class="fw-bold text-dark mb-2">¡Contraseña actualizada!</h5>
            <p class="text-muted mb-4">Tu contraseña se cambió correctamente. La próxima vez que inicies sesión, usá la nueva.</p>
            <a href="{% if user.cliente_portal %}{% url 'portal:home' %}{% else %}{% url 'dashboard:index' %}{% endif %}" class="btn btn-primary fw-bold px-4 py-2 rounded-3 shadow-sm">
                <i class="bi bi-arrow-left me-2"></i> Volver
            </a>
        </div>
    </div>
</div>
{% endblock %}
