<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace Enviado - VeterSystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Alineado a la paleta violeta/azul en degradé del resto de la app (ver base.html). */
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%); border-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #6366f1 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); width: 100%; max-width: 440px; text-align: center; }
    </style>
</head>
<body>
<div class="login-card p-4 p-sm-5">
    <div class="bg-success-subtle text-success-emphasis rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
        <i class="bi bi-envelope-check-fill fs-1"></i>
    </div>
    <h5 class="fw-bold text-dark mb-2">¡Enlace enviado!</h5>
    <p class="text-muted small mb-4">Si el correo ingresado está registrado, vas a recibir un email con las instrucciones para restablecer tu contraseña en los próximos minutos.</p>
    <a href="{% url 'login' %}" class="btn btn-primary fw-bold rounded-3 px-4 shadow-sm"><i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión</a>
</div>
</body>
</html>
