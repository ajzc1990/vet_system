<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - VeterSystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Alineado a la paleta violeta/azul en degradé del resto de la app (ver base.html). */
        .fw-extrabold { font-weight: 800 !important; }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%); border-color: transparent; }
        .text-primary { color: #6366f1 !important; }
        .bg-primary { background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%) !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #6366f1 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.4); width: 100%; max-width: 440px; }
        .form-control { background-color: #f8fafc; padding: 0.75rem 1rem; }
        .btn-primary-custom { background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%); border: none; padding: 0.8rem; font-weight: 700; border-radius: 12px; }
    </style>
</head>
<body>
<div class="login-card p-4 p-sm-5">
    <div class="text-center mb-4">
        <a href="{% url 'landing' %}" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
            <div class="bg-primary text-white p-2 rounded-3 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px;"><i class="bi bi-heart-pulse-fill fs-4"></i></div>
            <span class="fs-3 fw-extrabold text-dark">Veter<span class="text-primary">System</span></span>
        </a>
        <h5 class="fw-bold text-dark mb-1">Recuperar Contraseña</h5>
        <p class="text-muted small">Ingresá tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-bold text-dark small">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" name="email" class="form-control rounded-end-3 border-start-0" placeholder="tu@email.com" required autofocus>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-primary-custom w-100 mb-3 shadow-sm">
            <i class="bi bi-send-fill me-2"></i> Enviar Enlace de Recuperación
        </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
        <a href="{% url 'login' %}" class="fw-bold text-primary text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión</a>
    </div>
</div>
</body>
</html>
