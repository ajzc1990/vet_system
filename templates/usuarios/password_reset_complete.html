<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada - VetSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0d6efd 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); width: 100%; max-width: 440px; text-align: center; }
    </style>
</head>
<body>
<div class="login-card p-4 p-sm-5">
    <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
        <i class="bi bi-check-circle-fill fs-1"></i>
    </div>
    <h5 class="fw-bold text-dark mb-2">¡Contraseña actualizada!</h5>
    <p class="text-muted small mb-4">Ya podés iniciar sesión con tu nueva contraseña.</p>
    <a href="{% url 'login' %}" class="btn btn-primary fw-bold rounded-3 px-4 shadow-sm"><i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión</a>
</div>
</body>
</html>
