# Servidor HTTP: Redirige todo el tráfico a HTTPS y permite validación Certbot
server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com; # 👈 Reemplazá por tu dominio o IP

    # Desafío de Let's Encrypt para generar/renovar certificados SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección permanente a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS con Certificado SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com www.tu-dominio.com; # 👈 Reemplazá por tu dominio

    # Certificados SSL gestionados por Certbot
    ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem; # 👈 Cambiar por tu dominio
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem; # 👈 Cambiar por tu dominio

    # Parámetros de seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Límite máximo de subida para archivos adjuntos/estudios médicos
    client_max_body_size 25M;

    # Servir Archivos Estáticos directamente desde Nginx (Bootstrap, CSS, JS)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Servir Archivos de Medios subidos por usuarios (Estudios, Fotos, PDFs)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy hacia el contenedor Gunicorn/Django
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}