services:
  db:
    image: postgres:15-alpine
    container_name: vetersystem_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-vetersystem_db}
      POSTGRES_USER: ${DB_USER:-vetersystem_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetersystem_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vetersystem_user} -d ${DB_NAME:-vetersystem_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: vetersystem_django
    restart: always
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn --bind 0.0.0.0:8000 --workers 3 core.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - USE_POSTGRES=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-vetersystem_db}
      - DB_USER=${DB_USER:-vetersystem_user}
      - DB_PASSWORD=${DB_PASSWORD:-vetersystem_pass_2026}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: vetersystem_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: vetersystem_certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_etc:
  certbot_var: